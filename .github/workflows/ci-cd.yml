name: CI / CD

on:
  pull_request:
    branches: [develop, main]
    types: [opened, synchronize, reopened]
  push:
    branches: [develop, main]

permissions:
  contents: read

jobs:
  verify:
    name: verify
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency:
      group: verify-${{ github.ref }}
      cancel-in-progress: true
    # Keep these steps in sync with the `verify` script in package.json.
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Format
        run: npm run format:check
      - name: Lint
        run: npm run lint
      - name: Styles
        run: npm run stylelint
      - name: Types
        run: npm run check
      - name: Build
        run: npm run build

  deploy-development:
    name: deploy-development
    needs: verify
    if: github.event_name == 'push' && github.ref == 'refs/heads/develop'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: development
      url: https://portfolio-development.andresbetov.workers.dev
    concurrency:
      group: deploy-development
      cancel-in-progress: false
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Build
        run: npm run build
      - name: Deploy Worker (development)
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          # Multiple environments are defined in wrangler.jsonc; `--env=""` explicitly
          # targets the top-level development Worker, as Wrangler recommends.
          command: deploy --env=""

  deploy-production:
    name: deploy-production
    needs: verify
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && !github.event.created
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: production
      url: https://portfolio-production.andresbetov.workers.dev
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Build
        run: npm run build
      - name: Deploy Worker (production)
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          environment: production
